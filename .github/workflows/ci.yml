# CI: typecheck · test · lint · format:check · provenance guard · PG boot.
# Replaces the old byte-identical-to-QM check, which is meaningless now
# that we absorb instead of fork.
name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vital
          POSTGRES_USER: vital
          POSTGRES_PASSWORD: vital-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vital -d vital"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      # The suite writes var/status.json; this fails if README/idea.md/TODO.md
      # quote a test count older than the latest green run.
      - run: npm run docs:check
      # Engine-specific lane: derived schema, dialect helpers, and the
      # nextSeq atomicity that sqlite's BEGIN IMMEDIATE hides.
      - run: npm run test:postgres
        env:
          TEST_PG_URL: postgres://vital:vital-ci@localhost:5432/vital
      - run: npm run lint
      - run: npm run format:check
      - run: npm run verify:provenance
      - run: npm audit --omit=dev
      - run: node scripts/verify-instance.mjs
        env:
          DATABASE_URL: postgres://vital:vital-ci@localhost:5432/vital
