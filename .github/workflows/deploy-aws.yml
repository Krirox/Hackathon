# AWS deploy: build vital-core + executor images, push to ECR, terraform apply.
# Manual dispatch only — infra changes are never a side effect of a test push.
# Required repo secrets: AWS_ROLE_TO_ASSUME (OIDC), plus TF_VAR_* for every
# sensitive var in deploy/aws/variables.tf (see terraform.tfvars.example).
name: deploy-aws
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (default: short SHA)'
        required: false
        default: ''
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Build and push vital-core
        run: |
          aws ecr describe-repositories --repository-names vital-core 2>/dev/null || aws ecr create-repository --repository-name vital-core --image-tag-mutability IMMUTABLE --image-scanning-configuration scanOnPush=true
          CORE_REPO=$(aws ecr describe-repositories --repository-names vital-core --query 'repositories[0].repositoryUri' --output text)
          docker build -f deploy/aws/Dockerfile.vital-core -t "$CORE_REPO:${{ steps.tag.outputs.tag }}" .
          docker push "$CORE_REPO:${{ steps.tag.outputs.tag }}"
          echo "CORE_IMAGE=$CORE_REPO:${{ steps.tag.outputs.tag }}" >> "$GITHUB_ENV"
      - name: Build and push executor
        run: |
          aws ecr describe-repositories --repository-names vital-executor 2>/dev/null || aws ecr create-repository --repository-name vital-executor --image-tag-mutability IMMUTABLE --image-scanning-configuration scanOnPush=true
          EXEC_REPO=$(aws ecr describe-repositories --repository-names vital-executor --query 'repositories[0].repositoryUri' --output text)
          docker build -f deploy/aws/Dockerfile.executor -t "$EXEC_REPO:${{ steps.tag.outputs.tag }}" .
          docker push "$EXEC_REPO:${{ steps.tag.outputs.tag }}"
          echo "EXECUTOR_IMAGE=$EXEC_REPO:${{ steps.tag.outputs.tag }}" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform apply
        working-directory: deploy/aws
        env:
          TF_VAR_tenant_hmac_secret: ${{ secrets.TF_VAR_TENANT_HMAC_SECRET }}
          TF_VAR_vital_core_secret: ${{ secrets.TF_VAR_VITAL_CORE_SECRET }}
          TF_VAR_webhook_secret: ${{ secrets.TF_VAR_WEBHOOK_SECRET }}
          TF_VAR_serper_api_key: ${{ secrets.TF_VAR_SERPER_API_KEY }}
          TF_VAR_gemini_api_key: ${{ secrets.TF_VAR_GEMINI_API_KEY }}
          TF_VAR_novita_api_key: ${{ secrets.TF_VAR_NOVITA_API_KEY }}
          TF_VAR_operator_secret: ${{ secrets.TF_VAR_OPERATOR_SECRET }}
        run: |
          if [ -n "${{ secrets.TF_BACKEND_BUCKET }}" ]; then
            terraform init -input=false \
              -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
              -backend-config="key=${{ vars.TF_BACKEND_KEY || 'vital/terraform.tfstate' }}" \
              -backend-config="region=$AWS_REGION" \
              -backend-config="dynamodb_table=${{ vars.TF_BACKEND_DYNAMODB_TABLE || 'vital-tfstate-locks' }}" \
              -backend-config="encrypt=true"
          else
            terraform init -input=false
          fi
          terraform apply -input=false -auto-approve \
            -var "region=$AWS_REGION" \
            -var "core_image=$CORE_IMAGE" \
            -var "executor_image=$EXECUTOR_IMAGE"
      - name: Smoke check
        run: |
          echo "Waiting for ECS service stability..."
          aws ecs wait services-stable --cluster vital --services vital-core
          ALB=$(terraform -chdir=deploy/aws output -raw alb_dns)
          echo "Checking healthz endpoint..."
          HEALTH=$(curl -fsSL --retry 5 --retry-delay 3 "http://$ALB/healthz")
          echo "$HEALTH" | grep '"ok":true'
          echo "Verifying non-billable executor dry-run invocation..."
          aws lambda invoke --function-name vital-executor \
            --payload '{"dryRun":true}' \
            --cli-binary-format raw-in-base64-out /dev/null
