# Local smoke stack only (CI / E2E-17). Production is deploy/aws/ (ECS, RDS,
# ElastiCache, S3, Lambda, Buzz relay). This does not start Buzz, jcode, SQS,
# or execution workers. Bind published ports to loopback before sharing access.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vital}
      POSTGRES_USER: ${POSTGRES_USER:-vital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vital} -d ${POSTGRES_DB:-vital}']
      interval: 5s
      timeout: 3s
      retries: 12

  vital-core:
    build:
      context: ..
      dockerfile: deploy/aws/Dockerfile.vital-core
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vital}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vital}

      VITAL_TENANT: ${VITAL_TENANT:-acme}
      VITAL_OPERATOR_SECRET: ${VITAL_OPERATOR_SECRET:-}
      VITAL_OPERATOR_KEYS: ${VITAL_OPERATOR_KEYS:-}
      # First-run owner bootstrap (forced password change at first login).
      # Empty (default) = web signup claims an unprovisioned console, exactly
      # like production without bootstrap credentials behind the ALB gate.
      VITAL_BOOTSTRAP_EMAIL: ${VITAL_BOOTSTRAP_EMAIL:-}
      VITAL_BOOTSTRAP_PASSWORD: ${VITAL_BOOTSTRAP_PASSWORD:-}
    ports:
      - '127.0.0.1:3100:3100'
    depends_on:
      postgres:
        condition: service_healthy
    # E2E-17: liveness only — readiness (DB, worker, integrations) is
    # asserted by scripts/verify-topology.mjs, never by this probe.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3100/healthz'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
